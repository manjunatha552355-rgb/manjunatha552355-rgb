# ── Visibility ───────────────────────────────────────────────────────────────
[repos]
# Private repositories are only read when PROFILE_TOKEN is set AND this is true.
# Their names/descriptions would then be public on your profile — opt in deliberately.
include_private = false
include_forks = false
include_archived = true        # shown with an "Archived" marker
exclude = ["manjunatha552355-rgb", "manjunatha552355-rgb.github.io"]

# ── Featured projects ────────────────────────────────────────────────────────
[featured]
count = 4   # automatic selection fills the remaining slots by score (activity, depth, completeness)

# ── Repository Explorer ──────────────────────────────────────────────────────
[explorer]
max_per_category = 12   # README stays compact; the full list goes to profile/CATALOG.md

# ── Feature extraction ───────────────────────────────────────────────────────
[analysis]
# README headings searched for capability bullets/tables, in priority order.
feature_sections = ["Key Features", "Features", "Capabilities", "Highlights", "What it does",
                    "Use Cases", "Overview", "Architecture", "How it works"]
max_features = 4
# Files read (if present) as technology evidence.
manifests = ["requirements.txt", "pyproject.toml", "Pipfile", "environment.yml", "package.json",
             "build.gradle.kts", "app/build.gradle.kts", "gradle/libs.versions.toml",
             "Dockerfile", "docker-compose.yml", "compose.yaml", "go.mod", "Cargo.toml",
             "edge/wrangler.toml", "wrangler.toml", ".github/workflows"]
ignore_languages = ["Batchfile", "Procfile", "Makefile", "PowerShell"]

# ── Per-project curation (optional) ──────────────────────────────────────────
# Keys are repository names. Every field is optional:
#   featured = true|false   pin or exclude from Featured
#   category = "..."        override automatic classification
#   tagline  = "..."        replaces the GitHub description on cards
#   features = ["...", ...] replaces README-extracted capabilities
#   demo / docs / architecture = "url"
[projects.toon-llm]
featured = true

[projects.cortextrace]
docs = "https://github.com/manjunatha552355-rgb/cortextrace/tree/HEAD/docs"
architecture = "https://github.com/manjunatha552355-rgb/cortextrace/blob/HEAD/docs/ARCHITECTURE.md"

# ── Classification ───────────────────────────────────────────────────────────
# Scored: topic match = 3, keyword in description/README = 1, language = 1.
# Highest score wins (ties → earlier category). Below min_score → "Other".
[classification]
min_score = 2

