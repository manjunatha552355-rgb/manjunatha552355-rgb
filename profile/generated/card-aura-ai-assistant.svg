</style><rect x="8" y="8" width="824" height="412" rx="20" fill="#FFFFFF" stroke="#E3EAF2" filter="url(#sh)"/><text x="40.0" y="51.0" font-size="11" class="e">AI &amp; MACHINE LEARNING</text><rect x="744.0" y="34.0" width="56.0" height="24" rx="12.0" fill="#FFFFFF" stroke="#E3EAF2"/><text x="755.0" y="50.1" font-size="11.5" font-weight="560" fill="#46566A">Public</text><text x="40.0" y="90.0" font-size="25" font-weight="700" letter-spacing="-0.4">AURA-AI-Assistant</text><text x="40.0" y="120.0" font-size="15" class="b">AURA - ambient AI voice assistant for Android: on-device VAD, Opus, Whisper transcription, Gemini 4-pillar</text><text x="40.0" y="142.0" font-size="15" class="b">summaries, action-item automation. Free-tier infrastructure.</text><g class="in" style="animation-delay:0.25s"><rect x="40.0" y="166" width="3" height="14" rx="1.5" fill="#3B9BDB"/><text x="53.0" y="177.0" font-size="13.5" font-weight="620">Two recording modes</text><text x="53.0" y="196.0" font-size="12.5" class="b">Meeting (tap to start/stop) and Ambient (continuous listening with</text><text x="53.0" y="214.0" font-size="12.5" class="b">a summary that refreshes every 15 minutes)</text></g><g class="in" style="animation-delay:0.33s"><rect x="436.0" y="166" width="3" height="14" rx="1.5" fill="#3B9BDB"/><text x="449.0" y="177.0" font-size="13.5" font-weight="620">On-device voice activity detection</text><text x="449.0" y="196.0" font-size="12.5" class="b">(Silero VAD via ONNX Runtime) — silence never leaves the phone</text><text x="449.0" y="214.0" font-size="12.5" class="b">and is never billed</text></g><g class="in" style="animation-delay:0.41s"><rect x="40.0" y="234" width="3" height="14" rx="1.5" fill="#3B9BDB"/><text x="53.0" y="245.0" font-size="13.5" font-weight="620">Opus compression</text><text x="53.0" y="264.0" font-size="12.5" class="b">(Concentus + hand-rolled Ogg muxer) — ~24 kbps voice-only</text><text x="53.0" y="282.0" font-size="12.5" class="b">audio</text></g><g class="in" style="animation-delay:0.49s"><rect x="436.0" y="234" width="3" height="14" rx="1.5" fill="#3B9BDB"/><text x="449.0" y="245.0" font-size="13.5" font-weight="620">Edge proxy on Cloudflare Workers</text><text x="449.0" y="264.0" font-size="12.5" class="b">API keys live server-side, never in the APK</text></g><g class="in" style="animation-delay:0.50s"><rect x="40.0" y="320.0" width="54.6" height="24" rx="12.0" fill="#EBF5FD" stroke="#D3E7F7"/><text x="51.0" y="336.3" font-size="12" font-weight="560" fill="#17212B">Kotlin</text><rect x="102.6" y="320.0" width="67.0" height="24" rx="12.0" fill="#EBF5FD" stroke="#D3E7F7"/><text x="113.6" y="336.3" font-size="12" font-weight="560" fill="#17212B">Android</text><rect x="177.6" y="320.0" width="134.9" height="24" rx="12.0" fill="#EBF5FD" stroke="#D3E7F7"/><text x="188.6" y="336.3" font-size="12" font-weight="560" fill="#17212B">Cloudflare Workers</text><rect x="320.5" y="320.0" width="41.4" height="24" rx="12.0" fill="#EBF5FD" stroke="#D3E7F7"/><text x="331.5" y="336.3" font-size="12" font-weight="560" fill="#17212B">Hilt</text><rect x="369.9" y="320.0" width="122.6" height="24" rx="12.0" fill="#EBF5FD" stroke="#D3E7F7"/><text x="380.9" y="336.3" font-size="12" font-weight="560" fill="#17212B">Jetpack Compose</text><rect x="500.5" y="320.0" width="105.0" height="24" rx="12.0" fill="#EBF5FD" stroke="#D3E7F7"/><text x="511.5" y="336.3" font-size="12" font-weight="560" fill="#17212B">ONNX Runtime</text><rect x="613.5" y="320.0" width="54.1" height="24" rx="12.0" fill="#EBF5FD" stroke="#D3E7F7"/><text x="624.5" y="336.3" font-size="12" font-weight="560" fill="#17212B">Room</text><rect x="675.6" y="320.0" width="69.3" height="24" rx="12.0" fill="#EBF5FD" stroke="#D3E7F7"/><text x="686.6" y="336.3" font-size="12" font-weight="560" fill="#17212B">Whisper</text></g><line x1="40" y1="366" x2="800" y2="366" stroke="#E3EAF2"/><polygon points="47.00,385.50 48.65,389.73 53.18,389.99 49.66,392.87 50.82,397.26 47.00,394.80 43.18,397.26 4