<svg xmlns="http://www.w3.org/2000/svg" width="840" height="428" viewBox="0 0 840 428" role="img" aria-label="AURA-AI-Assistant: AURA - ambient AI voice assistant for Android: on-device VAD, Opus, Whisper transcription, Gemini 4-pillar summaries, action-item automation. Free-tier infrastructure. Two recording modes. On-device voice activity detection. Opus compression. Edge proxy on Cloudflare Workers. 0 stars, 17 commits."><title>AURA-AI-Assistant: AURA - ambient AI voice assistant for Android: on-device VAD, Opus, Whisper transcription, Gemini 4-pillar summaries, action-item automation. Free-tier infrastructure. Two recording modes. On-device voice activity detection. Opus compression. Edge proxy on Cloudflare Workers. 0 stars, 17 commits.</title><defs><filter id="sh" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1D4E7A" flood-opacity=".07"/></filter></defs><style>
