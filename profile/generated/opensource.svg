<svg xmlns="http://www.w3.org/2000/svg" width="840" height="243" viewBox="0 0 840 243" role="img" aria-label="Open Source: Public repositories 5, Open-source licensed 1/5, Stars 1, Forks 0, External repos contributed to 1. Contributed to slshoerackmarketing-png/sl-shoe-rack"><title>Open Source: Public repositories 5, Open-source licensed 1/5, Stars 1, Forks 0, External repos contributed to 1. Contributed to slshoerackmarketing-png/sl-shoe-rack</title><defs><filter id="sh" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1D4E7A" flood-opacity=".07"/></filter></defs><style>
